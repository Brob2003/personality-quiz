<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Superhero Are You?</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS Link pointing to css/style.css -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light text-dark">

  <div class="container my-5" style="max-width: 700px;">
    <header class="text-center mb-5">
      <h1 class="fw-bold">What Superhero Are You?</h1>
      <p class="lead text-muted">Answer 4 quick questions to discover your secret hero identity!</p>
    </header>

    <!-- Quiz Form / Questions Container -->
    <main id="quiz-container">

      <!-- Question 1 -->
      <div class="card mb-4 shadow-sm question-block">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-3">1. How do you handle a crisis?</h5>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="1">
              Charge straight into action without hesitation.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="2">
              Analyze the situation and construct a clever strategy.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="3">
              Stay in the shadows and evaluate the security risks first.
            </button>
          </div>
        </div>
      </div>

      <!-- Question 2 -->
      <div class="card mb-4 shadow-sm question-block">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-3">2. Choose your primary weapon or tool:</h5>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="1">
              Pure muscle and super strength.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="2">
              Advanced high-tech armor and gadgets.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="3">
              Stealth, tactical gear, and martial arts skills.
            </button>
          </div>
        </div>
      </div>

      <!-- Question 3 -->
      <div class="card mb-4 shadow-sm question-block">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-3">3. Where is your ideal superhero headquarters?</h5>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="1">
              A fortress located high up in the mountains.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="2">
              A top-floor lab in a modern skyscraper.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="3">
              A high-tech subterranean cave hidden below ground.
            </button>
          </div>
        </div>
      </div>

      <!-- Question 4 -->
      <div class="card mb-4 shadow-sm question-block">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-3">4. What is your ultimate goal?</h5>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="1">
              Protecting everyone and defending justice everywhere.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="2">
              Innovating technology to solve complex world problems.
            </button>
            <button type="button" class="btn btn-outline-primary text-start answer-btn" data-score="3">
              Keeping the city safe from behind the scenes.
            </button>
          </div>
        </div>
      </div>

      <!-- Submit Section -->
      <div class="text-center my-4">
        <button id="submit-btn" class="btn btn-success btn-lg px-5">Show Results</button>
        <p id="error-msg" class="text-danger mt-2 d-none">Please answer all questions before submitting!</p>
      </div>

    </main>

    <!-- Results Display Container (Initially Hidden) -->
    <div id="result-container" class="card shadow p-4 text-center d-none">
      <h2 id="result-title" class="fw-bold mb-3"></h2>
      <p id="result-desc" class="lead text-secondary"></p>
      <div class="mt-4">
        <button id="restart-btn" class="btn btn-outline-secondary">Retake Quiz</button>
      </div>
    </div>

  </div>

  <!-- JavaScript Link pointing to js/script.js -->
  <script src="js/script.js"></script>
</body>
</html>
